name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate sources
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JavaScript syntax
        run: node .github/scripts/validate.mjs js

      - name: JSON syntax
        run: node .github/scripts/validate.mjs json

      - name: Extension manifest
        run: node .github/scripts/validate.mjs manifest

      - name: Unit tests
        run: |
          node test/protect.mjs
          node test/bot.mjs

      - name: WebAssembly module
        run: node wasm/test.mjs
