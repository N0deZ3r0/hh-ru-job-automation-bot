name: Bug report
description: Something is broken or behaves unexpectedly
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report.
        Write in English or Russian, whichever you prefer.
        **Пишите по-русски или по-английски — как удобнее.**

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? / Что вы ожидали и что получилось.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Шаги для воспроизведения.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: ext-version
    attributes:
      label: Extension version
      description: chrome://extensions → version. / Версия расширения.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: chrome://version. / Браузер и его версия.
      placeholder: "Chrome 141.0.7390.55"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Операционная система
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or console output
      description: |
        DevTools → Console. Errors from the extension's service worker help most.
        Логи из консоли DevTools — особенно ошибки service worker.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I am running the latest release / У меня последняя версия
          required: true
        - label: I searched existing issues / Я поискал среди существующих задач
          required: true
