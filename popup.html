<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 200px; padding: 20px; margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; text-align: center; min-height: 150px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .status-container {
      background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
      border-radius: 15px; padding: 20px; width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.2);
    }
    .status-icon { font-size: 32px; margin-bottom: 10px; animation: pulse 2s infinite; }
    .status-text { font-size: 14px; font-weight: 600; margin: 0; }
    .status-connected { color: #4ade80; }
    .status-disconnected { color: #f87171; }
    .version { font-size: 10px; opacity: 0.7; margin-top: 10px; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
  </style>
</head>
<body>
  <div class="status-container">
    <div class="status-icon" id="statusIcon">🚀</div>
    <p class="status-text" id="status">✅ Расширение активировано</p>
    <div class="version">HH Авто-отклик v2.0 🛡️</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
